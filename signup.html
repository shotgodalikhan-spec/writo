<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create a free account | Writo</title>
<meta name="description" content="Create a free Writo account: 5 essay checks a day and your results saved.">
<link rel="canonical" href="https://getwrito.pages.dev/signup">
<meta property="og:type" content="website">
<meta property="og:url" content="https://getwrito.pages.dev/signup">
<meta property="og:title" content="Create a free account | Writo">
<meta property="og:description" content="Create a free Writo account: 5 essay checks a day and your results saved.">
<meta property="og:image" content="https://getwrito.pages.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FAF4EA">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/style.css">
<script>(function(){try{var t=localStorage.getItem("writo-theme")||"system";var d=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light")}catch(e){}})()</script>
</head>
<body data-page="signup">
<main id="main">
<div class="wrap auth">
  <div class="panel">
    <h1>Create your free account</h1>
    <p class="muted">5 checks a day, your results saved, nothing to pay.</p>
    <form id="signup-form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@gmail.com" required></div>
      <div class="field"><label for="password">Password <span class="hint">at least 8 characters</span></label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div>
      <label class="check-row field"><input id="consent" type="checkbox" required><span>I agree to the <a href="/terms" target="_blank">Terms of use</a> and <a href="/privacy" target="_blank">Privacy policy</a>.</span></label>
      <label class="check-row field"><input id="history" type="checkbox" checked><span>Save my essays and results <span class="hint">(only you can see them)</span></span></label>
      <div id="signup-err" role="alert" hidden></div>
      <button class="btn big" type="submit">Create free account</button>
    </form>
    <p class="muted small" style="margin:18px 0 0">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
</main>
<script src="/assets/site.js"></script>
<script src="/assets/account.js"></script>
</body>
</html>
